<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>🎁 Бабуле 67</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { overflow-x: hidden; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #ffd6a5, #ff9a9e, #fbc2eb, #ffb347);
    background-size: 400% 400%;
    animation: bgMove 18s ease infinite;
    min-height: 100vh;
    padding: 20px 14px 60px;
    position: relative;
  }
  @keyframes bgMove {
    0%,100% { background-position: 0% 50%; }
    50%     { background-position: 100% 50%; }
  }

  .bg-number {
    position: fixed;
    font-weight: 900;
    color: rgba(255,255,255,0.14);
    pointer-events: none;
    user-select: none;
    z-index: 0;
    line-height: 1;
  }

  .falling {
    position: fixed; top:-70px;
    font-size: 30px;
    pointer-events: none;
    animation: fall linear forwards;
    z-index: 1;
    opacity: 0.9;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
  }
  @keyframes fall {
    to { transform: translateY(115vh) rotate(540deg); }
  }

  .card {
    background: rgba(255,255,255,0.97);
    border-radius: 26px;
    padding: 26px 18px;
    max-width: 460px;
    margin: 0 auto;
    box-shadow: 0 24px 70px rgba(0,0,0,0.28);
    text-align: center;
    position: relative;
    z-index: 10;
    animation: appear 0.7s ease-out;
  }
  @keyframes appear {
    from { opacity:0; transform: translateY(30px) scale(0.94); }
    to   { opacity:1; transform: translateY(0) scale(1); }
  }

  .age-badge {
    display:inline-block;
    background:#ffe066; color:#8a4b00;
    padding:5px 16px; border-radius:20px;
    font-size:14px; font-weight:bold;
    margin-bottom:10px;
    box-shadow: 0 4px 10px rgba(255,179,71,0.5);
  }
  h1 { font-size: 24px; color:#d6336c; margin: 6px 0 4px; }
  .subtitle { font-size: 15px; color: #777; margin-bottom: 6px; }

  .big-num {
    font-size: 92px;
    font-weight: 900;
    background: linear-gradient(135deg, #ff6b9d, #ffb347, #c44dff, #4d96ff, #ff6b9d);
    background-size: 400% 400%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 4s ease infinite;
    line-height: 1;
    letter-spacing: -4px;
    display: inline-block;
    filter: drop-shadow(0 8px 16px rgba(255,107,157,0.35));
    margin: 4px 0;
  }
  @keyframes shimmer {
    0%,100% { background-position: 0% 50%; }
    50%     { background-position: 100% 50%; }
  }

  .gift-title {
    font-size: 17px;
    font-weight: bold;
    color: #8a4b00;
    margin: 20px 0 12px;
  }
  .gift-title::before, .gift-title::after {
    content: "✨";
    margin: 0 8px;
    font-size: 14px;
  }

  .gifts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .gift-btn {
    border: none;
    border-radius: 18px;
    padding: 18px 10px 14px;
    font-size: 14px;
    font-weight: bold;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(0,0,0,0.18);
    transition: transform 0.15s;
    animation: glowPulse 2.2s ease-in-out infinite;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  @keyframes glowPulse {
    0%,100% { box-shadow: 0 10px 24px rgba(0,0,0,0.18), 0 0 0 0 rgba(255,255,255,0.6); }
    50%     { box-shadow: 0 10px 30px rgba(0,0,0,0.25), 0 0 0 8px rgba(255,255,255,0); }
  }
  .gift-btn:active { transform: scale(0.93); }
  .gift-btn .ico {
    font-size: 32px;
    line-height: 1;
    animation: bob 1.8s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-4px); }
  }
  .gift-btn .label { font-size: 13px; }

  .g-music  { background: linear-gradient(135deg,#ff6b9d,#c44dff); }
  .g-voice  { background: linear-gradient(135deg,#4d96ff,#6bcB77); }
  .g-fire   { background: linear-gradient(135deg,#ff6b6b,#ffb347); }
  .g-box    { background: linear-gradient(135deg,#ffb347,#ffd93d); color:#5a3a00; text-shadow:none; }
  .g-fore   { background: linear-gradient(135deg,#a18cd1,#fbc2eb); color:#4a1a5c; text-shadow:none; grid-column: span 2; }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 200;
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  .modal.hidden { display: none; }
  .modal-card {
    background: #fff;
    border-radius: 22px;
    padding: 26px 20px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }
  @keyframes popIn {
    from { opacity:0; transform: scale(0.6); }
    to   { opacity:1; transform: scale(1); }
  }
  .modal-card h2 { color: #d6336c; font-size: 22px; margin-bottom: 12px; }
  .modal-card p { color: #444; font-size: 16px; line-height: 1.55; margin-bottom: 12px; }
  .modal-close {
    position: absolute;
    top: 10px; right: 14px;
    background: #eee;
    border: none;
    width: 34px; height: 34px;
    border-radius: 50%;
    font-size: 18px;
    color: #666;
    cursor: pointer;
    font-weight: bold;
  }
  .modal-close:active { transform: scale(0.9); }
  .modal-icon {
    font-size: 60px;
    display: block;
    margin: 6px 0 8px;
    animation: pulse 1.4s ease infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.15);} }

  .box-shake {
    font-size: 70px;
    display: inline-block;
    animation: shake 0.5s ease infinite;
  }
  @keyframes shake {
    0%,100% { transform: rotate(-8deg) translateX(-3px); }
    50%     { transform: rotate(8deg) translateX(3px); }
  }
  .box-boom { animation: boom 0.6s ease-out forwards; }
  @keyframes boom {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.6) rotate(20deg); opacity: 0.8; }
    100% { transform: scale(0) rotate(60deg); opacity: 0; }
  }

  .fortune-text {
    background: linear-gradient(135deg, #fff0f6, #e7f1ff);
    border-left: 5px solid #c44dff;
    border-radius: 12px;
    padding: 16px 14px;
    font-size: 17px;
    color: #4a1a5c;
    text-align: left;
    line-height: 1.5;
    margin: 8px 0 4px;
    animation: appear 0.4s ease-out;
  }

  .footer-love {
    margin-top: 20px;
    font-size: 15px;
    color: #a61e4d;
    line-height: 1.6;
    font-weight: bold;
  }

  .firework {
    position: fixed;
    width: 8px; height: 8px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 150;
  }
  .confetti {
    position: fixed;
    width: 10px; height: 10px;
    pointer-events: none;
    z-index: 150;
    animation: confettiFall 2.6s linear forwards;
  }
  @keyframes confettiFall {
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="card">
  <span class="age-badge">👵 67 лет — легенда!</span>
  <div class="big-num">67</div>
  <h1>Бабуля, с праздником!</h1>
  <p class="subtitle">Тебя ждут 5 подарков 🎁</p>

  <div class="gift-title">Нажми на любой подарок</div>

  <div class="gifts">
    <button class="gift-btn g-music" onclick="playMusic()">
      <span class="ico">🎵</span>
      <span class="label">Музыкальная открытка</span>
    </button>

    <button class="gift-btn g-voice" onclick="playVoice()">
      <span class="ico">🎤</span>
      <span class="label">Голосовое поздравление</span>
    </button>

    <button class="gift-btn g-fire" onclick="launchFirework()">
      <span class="ico">🎊</span>
      <span class="label">Салют из 67 искр</span>
    </button>

    <button class="gift-btn g-box" onclick="openBox()">
      <span class="ico">🎁</span>
      <span class="label">Открыть коробку</span>
    </button>

    <button class="gift-btn g-fore" onclick="showFortune()">
      <span class="ico">🔮</span>
      <span class="label">Предсказание на год</span>
    </button>
  </div>

  <div class="footer-love">Сделано с любовью для самой лучшей бабули 💖</div>

  <audio id="musicAudio" src="music.mp3" preload="auto"></audio>
  <audio id="voiceAudio" src="voice.mp3" preload="auto"></audio>
</div>

<div class="modal hidden" id="modal">
  <div class="modal-card">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <span class="modal-icon" id="modalIcon">🎁</span>
    <h2 id="modalTitle">Заголовок</h2>
    <div id="modalBody"></div>
  </div>
</div>

<script>
  const AGE = 67;

  function seedBgNumbers() {
    const positions = [
      {t:'3%', l:'2%', s:'120px', r:'-10deg'},
      {t:'18%', r:'3%', s:'90px',  r:'8deg'},
      {t:'45%', l:'-2%', s:'150px', r:'-14deg'},
      {t:'70%', r:'-3%', s:'130px', r:'12deg'},
      {t:'88%', l:'5%', s:'80px',  r:'-8deg'}
    ];
    positions.forEach(function(p) {
      const n = document.createElement('div');
      n.className = 'bg-number';
      n.textContent = AGE;
      if (p.t) n.style.top = p.t;
      if (p.l) n.style.left = p.l;
      if (p.r) n.style.right = p.r;
      n.style.fontSize = p.s;
      n.style.transform = 'rotate(' + p.r + ')';
      document.body.appendChild(n);
    });
  }
  seedBgNumbers();

  const fallingEmojis = ['🎁','🎈','🎀','✨','💝','🎊','🌸','🧶','🥧','💖','6️⃣','7️⃣'];
  setInterval(function() {
    const f = document.createElement('div');
    f.className = 'falling';
    f.textContent = fallingEmojis[Math.floor(Math.random()*fallingEmojis.length)];
    f.style.left = Math.random()*100 + 'vw';
    f.style.animationDuration = (5 + Math.random()*4) + 's';
    f.style.fontSize = (22 + Math.random()*18) + 'px';
    document.body.appendChild(f);
    setTimeout(function(){ f.remove(); }, 10000);
  }, 550);

  function openModal(icon, title, html) {
    document.getElementById('modalIcon').textContent = icon;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('modal').classList.remove('hidden');
  }
  function closeModal() {
    document.getElementById('modal').classList.add('hidden');
    document.getElementById('musicAudio').pause();
    document.getElementById('voiceAudio').pause();
  }
  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target.id === 'modal') closeModal();
  });

  function playMusic() {
    const a = document.getElementById('musicAudio');
    document.getElementById('voiceAudio').pause();
    if (a.paused) {
      a.currentTime = 0;
      a.play().catch(function() {
        openModal('🎵','Музыка не найдена',
          '<p>Положи рядом с HTML файл <b>music.mp3</b> — и музыка заиграет 💖</p>');
      });
      openModal('🎵','Музыкальная открытка','<p>Слушай и улыбайся! 🎶<br>Эта мелодия — для тебя 💝</p>');
    } else {
      a.pause();
      closeModal();
    }
  }

  function playVoice() {
    const a = document.getElementById('voiceAudio');
    document.getElementById('musicAudio').pause();
    if (a.paused) {
      a.currentTime = 0;
      a.play().catch(function() {
        openModal('🎤','Голосовое не найдено',
          '<p>Запиши голосовое, сохрани как <b>voice.mp3</b> и положи рядом с HTML 🎤</p>');
      });
      openModal('🎤','Голосовое поздравление','<p>Слушай — это для тебя, от всего сердца 💖</p>');
    } else {
      a.pause();
      closeModal();
    }
  }

  function launchFirework() {
    const colors = ['#ff6b9d','#c44dff','#ffd93d','#6bcB77','#4d96ff','#ffb347','#ff5e7e'];
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2.5;
    for (let i = 0; i < AGE; i++) {
      const p = document.createElement('div');
      p.className = 'firework';
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      const angle = (Math.PI * 2 * i) / AGE;
      const dist = 100 + Math.random() * 180;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      const dur = 1.1 + Math.random() * 0.8;
      p.style.transition = 'transform ' + dur + 's cubic-bezier(0.2,0.8,0.3,1), opacity ' + dur + 's ease-out';
      document.body.appendChild(p);
      requestAnimationFrame(function() {
        p.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(0)';
        p.style.opacity = '0';
      });
      setTimeout(function(){ p.remove(); }, dur * 1000 + 200);
    }
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random()*100 + 'vw';
      c.style.top = '-20px';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.animationDelay = Math.random()*0.4 + 's';
      document.body.appendChild(c);
      setTimeout(function(){ c.remove(); }, 3200);
    }
  }

  function openBox() {
    openModal('🎁','Открываем коробку…','<span class="box-shake" id="boxIcon">🎁</span><p style="margin-top:12px;color:#888;font-size:14px;">Трясём… трясём…</p>');

    setTimeout(function() {
      const b = document.getElementById('boxIcon');
      if (b) {
        b.classList.remove('box-shake');
        b.classList.add('box-boom');
      }
      launchFirework();
    }, 1500);

    setTimeout(function() {
      openModal('✨','Коробка открыта!',
        '<p>Внутри — <b>' + AGE + ' тёплых объятий</b> 🤗<br>' +
        '<b>' + AGE + ' добрых слов</b> 💬<br>' +
        '<b>' + AGE + ' поводов улыбнуться</b> 😊</p>' +
        '<p style="color:#a61e4d;font-weight:bold;margin-top:10px;">И бесконечная любовь внука 💖</p>');
      launchFirework();
    }, 2200);
  }

  const fortunes = [
    "Тебя ждёт <b>67 солнечных дней</b> в этом году ☀️",
    "<b>67 тёплых встреч</b> с любимыми внуками 💕",
    "Твои пироги принесут <b>67 улыбок</b> 🥧",
    "В году будет <b>67 поводов</b> обнять родных 🤗",
    "Ты услышишь <b>67 искренних «люблю»</b> 💖",
    "<b>67 комплиментов</b> от соседок и подруг 🌸",
    "<b>67 носков</b> будет связано с любовью 🧶",
    "Тебе подарят <b>67</b> поводов для гордости внуками 👏"
  ];

  function showFortune() {
    const f = fortunes[Math.floor(Math.random() * fortunes.length)];
    openModal('🔮','Твоё предсказание на год',
      '<div class="fortune-text">' + f + '</div>' +
      '<p style="font-size:13px;color:#888;margin-top:10px;">Нажми ещё — будет другое 😉</p>');
    const body = document.getElementById('modalBody');
    const again = document.createElement('button');
    again.textContent = '🔮 Ещё одно';
    again.style.cssText = 'margin-top:10px;background:linear-gradient(135deg,#a18cd1,#c44dff);color:#fff;border:none;padding:12px 20px;border-radius:50px;font-size:15px;font-weight:bold;cursor:pointer;width:100%;';
    again.onclick = showFortune;
    body.appendChild(again);
  }
</script>

</body>
</html>
